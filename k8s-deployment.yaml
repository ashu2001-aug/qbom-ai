# Q-BOM AI — Complete Kubernetes Manifests for AKS
# Apply: kubectl apply -f k8s-deployment.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: qbom
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbom-config
  namespace: qbom
data:
  ENVIRONMENT: "production"
  LANGCHAIN_PROJECT: "qbom-ai-prod"
  LANGCHAIN_TRACING_V2: "true"
  PINECONE_ENV: "us-east-1"
  PINECONE_INDEX: "qbom-crypto-index"
  AZURE_OPENAI_DEPLOYMENT: "gpt-4o"
  AZURE_OPENAI_API_VERSION: "2024-08-01-preview"
  SCHEDULER_ENABLED: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbom-scheduler-config
  namespace: qbom
data:
  SCHEDULER_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: qbom-secrets
  namespace: qbom
type: Opaque
stringData:
  AZURE_OPENAI_API_KEY: "REPLACE_FROM_KEY_VAULT"
  LANGCHAIN_API_KEY: "REPLACE_FROM_KEY_VAULT"
  PINECONE_API_KEY: "REPLACE_FROM_KEY_VAULT"
  DATABASE_URL: "REPLACE_FROM_KEY_VAULT"
  SECRET_KEY: "REPLACE_FROM_KEY_VAULT"
---
# BACKEND
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbom-backend
  namespace: qbom
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: qbom-backend
  template:
    metadata:
      labels:
        app: qbom-backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: qbom-backend
          image: qbomai.azurecr.io/qbom-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: qbom-config
            - secretRef:
                name: qbom-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
# SCHEDULER (single replica, SCHEDULER_ENABLED=true)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbom-scheduler
  namespace: qbom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbom-scheduler
  template:
    metadata:
      labels:
        app: qbom-scheduler
    spec:
      containers:
        - name: qbom-scheduler
          image: qbomai.azurecr.io/qbom-backend:latest
          envFrom:
            - configMapRef:
                name: qbom-config
            - configMapRef:
                name: qbom-scheduler-config
            - secretRef:
                name: qbom-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
# MCP SERVER
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbom-mcp
  namespace: qbom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbom-mcp
  template:
    metadata:
      labels:
        app: qbom-mcp
    spec:
      containers:
        - name: qbom-mcp
          image: qbomai.azurecr.io/qbom-backend:latest
          command: ["python", "mcp/server.py"]
          envFrom:
            - configMapRef:
                name: qbom-config
            - secretRef:
                name: qbom-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
# FRONTEND
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbom-frontend
  namespace: qbom
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: qbom-frontend
  template:
    metadata:
      labels:
        app: qbom-frontend
    spec:
      containers:
        - name: qbom-frontend
          image: qbomai.azurecr.io/qbom-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: qbom-backend-svc
  namespace: qbom
spec:
  selector:
    app: qbom-backend
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: qbom-frontend-svc
  namespace: qbom
spec:
  selector:
    app: qbom-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qbom-backend-hpa
  namespace: qbom
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qbom-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qbom-frontend-hpa
  namespace: qbom
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qbom-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qbom-backend-pdb
  namespace: qbom
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: qbom-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qbom-frontend-pdb
  namespace: qbom
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: qbom-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbom-ingress
  namespace: qbom
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/request-timeout: "120"
spec:
  tls:
    - hosts:
        - api.qbom.ai
        - qbom.ai
      secretName: qbom-tls-secret
  rules:
    - host: api.qbom.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbom-backend-svc
                port:
                  number: 80
    - host: qbom.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbom-frontend-svc
                port:
                  number: 80
