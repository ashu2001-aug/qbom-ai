# monitoring/prometheus-local.yml
# Prometheus config for local development with docker-compose.
# Scrapes metrics from the OTel collector's Prometheus exporter.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape metrics exported by OTel collector from the backend
  - job_name: qbom-backend
    static_configs:
      - targets: ["otel-collector:8889"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "qbom_.*"
        action: keep

  # Scrape the OTel collector's own health metrics
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Scrape Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
