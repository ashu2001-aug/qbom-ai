# monitoring/otel-collector.yaml
# OpenTelemetry Collector config for local development.
# Receives OTLP from the backend, exports to Jaeger (traces) and Prometheus (metrics).
#
# Access:
#   Jaeger UI:   http://localhost:16686  — search for service "qbom-ai-backend"
#   Prometheus:  http://localhost:9090   — query qbom_* metrics

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Add resource attributes to every span
  resource:
    attributes:
      - key: deployment.environment
        value: "development"
        action: insert
      - key: service.namespace
        value: "qbom"
        action: insert

  # Memory limiter — prevent OOM in local dev
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # Traces → Jaeger
  otlp/jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  # Metrics → Prometheus (scrape endpoint on :8889)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: qbom
    send_timestamps: true
    metric_expiration: 5m

  # Debug logging (traces summary in collector logs)
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 50

service:
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, resource, batch]
      exporters:  [otlp/jaeger, debug]

    metrics:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [prometheus]

  telemetry:
    logs:
      level: warn
